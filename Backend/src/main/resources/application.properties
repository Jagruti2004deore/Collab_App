# Server
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Uploads / realtime file previews
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:8MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:8MB}

# External code runner. Use a self-hosted Piston service in production for stable limits.
compiler.api-url=${COMPILER_API_URL:https://emkc.org/api/v2/piston}
compiler.timeout-ms=${COMPILER_TIMEOUT_MS:8000}
